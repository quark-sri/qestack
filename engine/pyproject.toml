[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qestack"
dynamic = ["version"]
description = "qestack AI test quality: gates that prove AI-written tests catch bugs (mutation, seeded faults, traceability, red-before-green, test locks, independent judge)."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "The qestack authors" }]
keywords = ["testing", "test-quality", "mutation-testing", "ai-agents", "claude-code", "qa", "test-automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/quark-sri/qestack"
Issues = "https://github.com/quark-sri/qestack/issues"

[project.scripts]
qestack = "qestack.cli:run"

[tool.setuptools.dynamic]
version = { attr = "qestack.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
qestack = ["data/*", "data/**/*"]

# =====================================================================================
# Stack: Java + Maven + JUnit 5 (Jupiter)
# Mutation testing: PIT (pitest-maven + pitest-junit5-plugin)
# See java-maven-junit5.md for the pom.xml setup and the conventions.
# =====================================================================================

[paths]
test_globs = ["**/src/test/java/**/*.java", "**/src/it/java/**/*.java", "**/src/integrationTest/java/**/*.java"]
source_globs = ["**/src/main/java/**/*.java"]

[tags]
# @Tag("FR-001")  and  @Tags({@Tag("a"), @Tag("b")})
tag_value_regex = ['@Tag\(\s*"([^"]+)"\s*\)']

[language]
name = "java"
string_style = "java"
test_marker_regex = '@(?:Test|ParameterizedTest|RepeatedTest|TestFactory|TestTemplate)\b'
skip_regex = '@(?:Disabled|Ignore)\b'
display_name_regex = '@DisplayName\(\s*"([^"]*)"\s*\)'
assertion_regexes = [
  # JUnit 5, AssertJ, Hamcrest, Truth, your own assert*/verify*/expect* helpers
  '\b(?:assert[A-Z]\w*|assertThat\w*|fail)\s*\(',
  '\b(?:verify|expect)[A-Z]\w*\s*\(',
  # Mockito interaction checks
  '\bverify\s*\(',
  # BDD style (AssertJ BDDAssertions.then, Mockito then(..).should())
  '\bthen\s*\(',
  # Java assert keyword (Surefire enables -ea by default)
  '\bassert\s+[^;]',
  # Awaitility, Spring MockMvc / WebTestClient, JSONAssert, Reactor StepVerifier
  '\.untilAsserted\s*\(',
  '\.andExpect\s*\(',
  '\.expect(?:Status|Body|Header)\w*\s*\(',
  '\bJSONAssert\.\w+\s*\(',
  '\.expect(?:Next|Error|Complete)\w*\s*\(',
  '\.verifyComplete\s*\(',
]
trivial_statement_regexes = [
  '^assertNotNull\(',
  '^Assertions\.assertNotNull\(',
  '^assertTrue\(true\)',
  '^assertFalse\(false\)',
  '^assertDoesNotThrow\(',
  '^assertThat\((?:true|false)\)\.is(?:True|False)\(\)$',
  '^assertThat\(.*\)\.isNotNull\(\)$',
  '^assertThat\(.*\)\.isNotEmpty\(\)$',
  '^assertThat\(.*\)\.isNotBlank\(\)$',
  '^assertThat\(.*\)\.isInstanceOf\([\w.]+\.class\)$',
  '^assertTrue\([\w.()]+\s*!=\s*null\)$',
  '^assertEquals\(([^,]+),\1\)$',
]
shallow_statement_regexes = [
  # API: only the HTTP status is checked
  '^assert(?:Equals|That)\(.*\b(?:status|statusCode|getStatus|getStatusCode|httpStatus)\b',
  '^assertEquals\((?:20\d|30\d|40\d|50\d),[\w.()]+\)$',
  # UI: only visibility is checked
  '^assertThat\(.*\)\.isVisible\(\)$',
]

[language.tag_examples]
class = '@Tag("feature-003")'
method = '@Test @Tag("FR-007") @Tag("US1-AS2") @Tag("boundary") @DisplayName("TC-014: ...")'

[smells.patterns]
conditional_logic = '^\s*(?:if|for|while|switch)\s*\('
fixed_sleep = 'Thread\.sleep\s*\(|TimeUnit\.\w+\.sleep\s*\(|\.waitForTimeout\s*\('
swallowed_exception = 'catch\s*\([^)]*\)\s*\{\s*\}'
console_output = 'System\.(?:out|err)\.print'
random_without_seed = 'new\s+Random\s*\(\s*\)|Math\.random\s*\('
current_time = '\b(?:LocalDate|LocalDateTime|Instant|ZonedDateTime|OffsetDateTime)\.now\s*\(\s*\)'

[commands]
# Configure <groups>${qe.groups}</groups> in Surefire AND Failsafe (see java-maven-junit5.md).
compile = "mvn -q -B -DskipTests test-compile"
test_feature = "mvn -q -B verify -Dqe.groups={feature_tag} -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false"
test_feature_random = "mvn -q -B verify -Dqe.groups={feature_tag} -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false -Djunit.jupiter.testmethod.order.default='org.junit.jupiter.api.MethodOrderer$Random' -Djunit.jupiter.testclass.order.default='org.junit.jupiter.api.ClassOrderer$Random'"
# PIT on the changed classes only. Excludes the slow container tests (tag "integration").
mutation = "mvn -q -B test-compile org.pitest:pitest-maven:mutationCoverage -DtargetClasses={target_classes} -DexcludedGroups=integration,ui -DoutputFormats=XML,HTML -DtimestampedReports=false"

[reports]
junit_globs = ["**/target/surefire-reports/TEST-*.xml", "**/target/failsafe-reports/TEST-*.xml"]
mutation_format = "pit-xml"
mutation_path = "**/target/pit-reports/mutations.xml"

# =====================================================================================
# Stack: Java + Maven + JUnit 5 (Jupiter)
# Mutation testing: PIT (pitest-maven + pitest-junit5-plugin)
# See java-maven-junit5.md for the pom.xml setup and the conventions.
# =====================================================================================

[paths]
test_globs = ["**/src/test/java/**/*.java", "**/src/it/java/**/*.java", "**/src/integrationTest/java/**/*.java"]
source_globs = ["**/src/main/java/**/*.java"]

[tags]
# @Tag("FR-001")  and  @Tags({@Tag("a"), @Tag("b")})
tag_value_regex = ['@Tag\(\s*"([^"]+)"\s*\)']

[language]
name = "java"
string_style = "java"
test_marker_regex = '@(?:Test|ParameterizedTest|RepeatedTest|TestFactory|TestTemplate)\b'
skip_regex = '@(?:Disabled|Ignore)\b'
display_name_regex = '@DisplayName\(\s*"([^"]*)"\s*\)'
assertion_regexes = [
  # JUnit 5, AssertJ, Hamcrest, Truth, your own assert*/verify*/expect* helpers
  '\b(?:assert[A-Z]\w*|assertThat\w*|fail)\s*\(',
  '\b(?:verify|expect)[A-Z]\w*\s*\(',
  # Mockito interaction checks
  '\bverify\s*\(',
  # BDD style (AssertJ BDDAssertions.then, Mockito then(..).should())
  '\bthen\s*\(',
  # Java assert keyword (Surefire enables -ea by default)
  '\bassert\s+[^;]',
  # Awaitility, Spring MockMvc / WebTestClient, JSONAssert, Reactor StepVerifier
  '\.untilAsserted\s*\(',
  '\.andExpect\s*\(',
  '\.expect(?:Status|Body|Header)\w*\s*\(',
  '\bJSONAssert\.\w+\s*\(',
  '\.expect(?:Next|Error|Complete)\w*\s*\(',
  '\.verifyComplete\s*\(',
]
trivial_statement_regexes = [
  '^assertNotNull\(',
  '^Assertions\.assertNotNull\(',
  '^assertTrue\(true\)',
  '^assertFalse\(false\)',
  '^assertDoesNotThrow\(',
  '^assertThat\((?:true|false)\)\.is(?:True|False)\(\)$',
  '^assertThat\(.*\)\.isNotNull\(\)$',
  '^assertThat\(.*\)\.isNotEmpty\(\)$',
  '^assertThat\(.*\)\.isNotBlank\(\)$',
  '^assertThat\(.*\)\.isInstanceOf\([\w.]+\.class\)$',
  '^assertTrue\([\w.()]+\s*!=\s*null\)$',
  '^assertEquals\(([^,]+),\1\)$',
  '^assertThat\((.+)\)\.isEqualTo\(\1\)$',
]
shallow_statement_regexes = [
  # API: only the HTTP status is checked (not a domain field such as order.status())
  '^assert(?:Equals|That)\(.*\b(?:statusCode|getStatusCode|httpStatus|getStatusCodeValue)\b',
  '^assertThat\(.*\.status\(\)\)\.isEqualTo\([1-5]\d\d\)$',
  '^assertEquals\((?:20\d|30\d|40\d|50\d),[\w.()]+\)$',
  # Exceptions: only the type is checked, not the error code or message
  '^assertThrows\(',
  '^assertThatThrownBy\(.*\)\.isInstanceOf\([\w.]+\.class\)$',
  '^assertThatExceptionOfType\(.*\)\.isThrownBy\(.*\)$',
  # Interactions: only "was called", with any arguments
  '^verify\(.*\)\.\w+\((?:any\w*\(\)\s*,?\s*)*\)$',
  # Collections: only the size is checked
  '^assertThat\(.*\)\.hasSize\(\d+\)$',
  # UI: only visibility is checked
  '^assertThat\(.*\)\.isVisible\(\)$',
]

[language.tag_examples]
class = '@Tag("feature-003")'
method = '@Test @Tag("FR-007") @Tag("US1-AS2") @Tag("boundary") @DisplayName("TC-014: ...")'

[smells.patterns]
conditional_logic = '^\s*(?:if|for|while|switch)\s*\('
fixed_sleep = 'Thread\.sleep\s*\(|TimeUnit\.\w+\.sleep\s*\(|\.waitForTimeout\s*\('
swallowed_exception = 'catch\s*\([^)]*\)\s*\{\s*\}'
console_output = 'System\.(?:out|err)\.print'
random_without_seed = 'new\s+Random\s*\(\s*\)|Math\.random\s*\('
current_time = '\b(?:LocalDate|LocalDateTime|LocalTime|Instant|ZonedDateTime|OffsetDateTime)\.now\s*\(|System\.currentTimeMillis\s*\(|Clock\.system\w*\s*\('
order_dependence = '@TestMethodOrder\s*\(|@Order\s*\('
conditional_execution = '\bassum(?:e|ing)\w*\s*\(|@(?:Enabled|Disabled)(?:If|On)\w*\b|disabledWithoutDocker\s*=\s*true'

[commands]
# Configure <groups>${qe.groups}</groups> in Surefire AND Failsafe (see java-maven-junit5.md).
compile = "mvn -q -B -DskipTests test-compile"
# -Dmaven.test.failure.ignore=true: Failsafe (integration) tests also run when unit tests fail
# (in the red phase every test fails). The engine reads the XML reports, not the exit code.
# -fae: in a multi-module build, the other modules continue after a failure.
# -Dsurefire.rerunFailingTestsCount=0: a rerun must not hide a flaky test.
# UNVERIFIED with a real build: check these properties in Task 3 (see java-maven-junit5.md).
test_feature = "mvn -q -B -fae verify -Dqe.groups={feature_tag} -Dmaven.test.failure.ignore=true -Dsurefire.rerunFailingTestsCount=0 -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false"
test_feature_random = "mvn -q -B -fae verify -Dqe.groups={feature_tag} -Dmaven.test.failure.ignore=true -Dsurefire.rerunFailingTestsCount=0 -DfailIfNoTests=false -Dsurefire.failIfNoSpecifiedTests=false -Djunit.jupiter.testmethod.order.default='org.junit.jupiter.api.MethodOrderer$Random' -Djunit.jupiter.testclass.order.default='org.junit.jupiter.api.ClassOrderer$Random' -Djunit.jupiter.execution.order.random.seed={seed}"
# PIT on the changed classes, with the feature tests only. Excludes the slow container tests (tag "integration").
mutation = "mvn -q -B -fae test-compile org.pitest:pitest-maven:mutationCoverage -DtargetClasses={target_classes} -DtargetTests={feature_test_classes} -DexcludedGroups=integration,ui -DfailWhenNoMutations=false -DoutputFormats=XML,HTML -DtimestampedReports=false"

[reports]
junit_globs = ["**/target/surefire-reports/TEST-*.xml", "**/target/failsafe-reports/TEST-*.xml"]
mutation_format = "pit-xml"
mutation_path = "**/target/pit-reports/mutations.xml"

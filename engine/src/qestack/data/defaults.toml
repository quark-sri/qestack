# =====================================================================================
# qestack - CORE DEFAULTS (generic, all projects)
#
# Do not edit this file. Put project changes in .qestack/project.toml.
# Load order: core defaults -> stack -> rulesets (in the listed order) -> .qestack/project.toml
# A later level overrides an earlier level. For a list, write "extra_<key>" to APPEND
# instead of replace (example: extra_custom_assertion_regexes = [...]).
# =====================================================================================

version = 1

[paths]
specs_dir = "specs"
runs_dir = ".qestack/runs"
locks_dir = ".qestack/locks"
# Set by the stack:
test_globs = []
source_globs = []
exclude_globs = [".qestack/runs/**", "**/target/**", "**/build/**", "**/bin/**", "**/obj/**", "**/node_modules/**", "**/generated/**"]
# Files that agents must never change. Humans change them (use CODEOWNERS).
# The installed engine (stacks, rulesets, rubrics) is also protected by the hook.
protected = [
  ".qestack/project.toml",
  ".qestack/project-rules.md",
  ".qestack/stacks/**",
  ".qestack/rulesets/**",
  ".qestack/rubrics/**",
  ".qestack/locks/**",
  ".claude/settings.json",
  ".claude/commands/speckit.test*.md",
]

[git]
# Base branch for "changed code" (mutation scope) and the guard. The merge-base is used.
base_ref = "origin/main"

[requirements]
# Requirement IDs. Speckit writes FR-001 in spec.md. The test plan adds EC-01 (edge cases).
id_regex = '(?:FR|NFR|SC|AC|EC|BR)-\d{2,4}'
# Acceptance scenarios get derived IDs: scenario 2 of "User Story 1" -> US1-AS2
derive_scenario_ids = true
scenario_id_regex = 'US\d+-AS\d+'
# Only these prefixes must be covered by tests. SC (success criteria) and NFR are often
# measured outside functional tests; add them if your tests cover them.
required_prefixes = ["FR", "US", "EC", "AC", "BR"]
# Speckit restarts FR numbers in each feature, so every test also carries a feature tag.
feature_tag_format = "feature-{num}"

# Default depth rules, used when test-plan.md does not list categories for an ID.
[requirements.depth_rules.FR]
all = ["positive"]
any = ["negative", "boundary", "error"]
[requirements.depth_rules.BR]
all = ["positive"]
any = ["negative", "boundary"]
[requirements.depth_rules.default]
all = []
any = []

[tags]
# Set by the stack: regexes with ONE capture group that return tag values.
tag_value_regex = []
# Test category tags. Every test should have at least one.
category_values = ["positive", "negative", "boundary", "error", "security", "contract", "performance", "resilience", "idempotency", "concurrency"]

[language]
name = ""
string_style = "java"          # java | csharp (how string literals are masked)
test_marker_regex = ""
skip_regex = ""
class_regex = '\b(?:class|record|struct)\s+(\w+)'
display_name_regex = ""
assertion_regexes = []
# Project settings: assertion helpers of your own libraries (one regex per entry point).
custom_assertion_regexes = []
# Statement-level regexes. A statement is normalized: no line breaks, no spaces around . ( ) [ ] ,
trivial_statement_regexes = []
shallow_statement_regexes = []

[smells]
todo_regex = '\b(?:TODO|FIXME|XXX)\b'
[smells.patterns]
conditional_logic = '^\s*(?:if|for|foreach|while|switch)\s*\('

[commands]
# Placeholders: {feature_tag} {feature} {target_classes} {changed_files} {changed_files_csv} {base_ref} {run}
compile = ""
test_feature = ""
test_feature_random = ""
mutation = ""
timeout_seconds = 3600

[reports]
junit_globs = []
mutation_format = "pit-xml"     # pit-xml | stryker-json
mutation_path = ""
clean_before_run = true

[gates]
trace_coverage_min = 1.0
hollow_max = 0
no_assertion_max = 0
skipped_max = 0
red_min = 1.0
flaky_max = 0
failing_max = 0
flaky_runs = 5
mutation_min = 0.75
seed_min = 0.90
guard_violations_max = 0
judge_rejects_max = 0
judge_coverage_min = 1.0
tqs_min = 80
# A gate in this list FAILS when its data is missing (NOT_RUN). Remove a gate here only
# with a written reason in .qestack/project.toml (for example "red" for brownfield code).
required = ["hollow", "no_assertion", "skipped", "trace", "red", "flaky", "failing", "mutation", "seed", "guard", "judge"]

[weights]
fault_detection = 0.35
requirement_depth = 0.25
assertion_strength = 0.15
independence = 0.15
maintainability = 0.10

[loop]
max_iterations = 4
min_improvement = 2.0   # TQS points
patience = 2            # iterations without improvement before escalation
audit_random = 5
audit_lowest = 5
max_feedback_mutants = 40
faults_min = 5
faults_max = 15

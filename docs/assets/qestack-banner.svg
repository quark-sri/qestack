    <radialGradient id="gC" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#3b82f6" stop-opacity="0.7"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>

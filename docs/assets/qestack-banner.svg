      <ellipse cx="120" cy="560" rx="240" ry="180" fill="url(#gB)" opacity="0.6"/>
    </g>
    <filter id="frost" x="-10%" y="-10%" width="120%" height="120%"><feGaussianBlur stdDeviation="22"/></filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">

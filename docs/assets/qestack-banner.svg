<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">qestack</title>
  <desc id="desc">qestack: QA and test automation skills, reviewer personas and quality gates for AI coding agents. Workflow: 1 plan tests from the spec, 2 write tests without the implementation, 3 prove they fail first, then lock them, 4 harden with mutants and hidden faults. The result is ACCEPT or ESCALATE, with evidence.</desc>

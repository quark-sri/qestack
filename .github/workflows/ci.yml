name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows support is planned for 0.2 (the test fixtures use POSIX shell commands).
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s engine/tests -v
      - name: Build and install the package
        run: |
          python -m pip install --upgrade pip build
          python -m build engine
          python -m pip install engine/dist/*.whl
          qestack --version
          qestack show rubrics/test-judge --path
        shell: bash

  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skills, agents, manifests and data files
        run: python scripts/validate_repo.py

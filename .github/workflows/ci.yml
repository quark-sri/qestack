name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"  # weekly: new Maven, Gradle or PIT releases can break the stack commands

jobs:
  engine:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows support is planned for 0.2 (the test fixtures use POSIX shell commands).
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s engine/tests -v
      - name: Build and install the package
        run: |
          python -m pip install --upgrade pip build
          python -m build engine
          python -m pip install engine/dist/*.whl
          qestack --version
          qestack show rubrics/test-judge --path
        shell: bash

  repo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate skills, agents, manifests and data files
        run: python scripts/validate_repo.py
      - name: Tests of the repository scripts
        run: python -m unittest discover -s scripts/tests -v
      - name: Build the portable skill packages and check them against the Agent Skills spec
        run: |
          python scripts/build_skills.py
          python scripts/validate_repo.py --spec dist/skills/*

  # The real build tools on the runnable examples. Not on pull requests (slow, needs Java).
  # The numbers are the "Results" sections of the example READMEs.
  examples:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [order-service-maven, order-service-gradle]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: ${{ matrix.example == 'order-service-gradle' && 'gradle' || 'maven' }}
      - name: Install the engine
        run: python -m pip install ./engine
      - name: Run lint and mutation with the real build tool
        working-directory: examples/${{ matrix.example }}
        shell: bash
        run: |
          # mutation scores the changed source files: make a change that keeps the code the same
          for f in src/main/java/com/example/order/*.java; do echo >> "$f"; done
          qestack lint --feature 001 || true       # the example tests are weak on purpose
          qestack mutation --feature 001 --base HEAD || true
      - name: Check the results against the README
        run: python scripts/check_example.py examples/${{ matrix.example }} --lint-total 5 --mutation 7/15
